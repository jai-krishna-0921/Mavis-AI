# Production stack for ONE t4g.small (arm64, 2 GB RAM + 2 GB swap). See deploy/aws/README section in README.md.
#   docker compose -f docker-compose.prod.yml --profile prod up -d --build
# Variables come from the .env next to this file (deploy/.env.prod.example documents them).
# The `prod` profile adds Caddy (HTTPS). Without it the api is reachable only inside the compose network
# (or via an override that publishes a port, which is how it is smoke-tested locally).
name: mavis-prod

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app-env: &app-env
  ENV: ${ENV:-prod}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
  LOG_JSON: "true"
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}
  LLM_REASONING_EFFORT_FAST: ${LLM_REASONING_EFFORT_FAST:-low}
  MODEL_FAST: ${MODEL_FAST:-deepseek-v4.1-flash}
  MODEL_SMART: ${MODEL_SMART:-glm-5.3}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
  COMPOSIO_WEBHOOK_SECRET: ${COMPOSIO_WEBHOOK_SECRET:-}
  INTEGRATION_PROVIDER: ${INTEGRATION_PROVIDER:-composio}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  NATIVE_TOKEN_KEK: ${NATIVE_TOKEN_KEK:-}
  NATIVE_TOKEN_KEK_PREVIOUS: ${NATIVE_TOKEN_KEK_PREVIOUS:-}
  SYNC_GMAIL_DAYS: ${SYNC_GMAIL_DAYS:-14}
  SYNC_SLACK_DAYS: ${SYNC_SLACK_DAYS:-7}
  SYNC_CALENDAR_BACK_DAYS: ${SYNC_CALENDAR_BACK_DAYS:-7}
  SYNC_CALENDAR_AHEAD_DAYS: ${SYNC_CALENDAR_AHEAD_DAYS:-30}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_MODE: ${TELEGRAM_MODE:-webhook}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET}
  ALLOWED_TELEGRAM_CHAT_IDS: ${ALLOWED_TELEGRAM_CHAT_IDS:?set ALLOWED_TELEGRAM_CHAT_IDS}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  DATABASE_URL: postgresql+psycopg://mavis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mavis
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
  INITIATIVE_ACT_ENABLED: ${INITIATIVE_ACT_ENABLED:-true}
  ATTENTION_ENABLED: ${ATTENTION_ENABLED:-true}
  # live E2E sink: a synthetic chat id whose sends go to a log, never Telegram (scripts/live_e2e.py)
  LIVE_TEST_ENABLED: ${LIVE_TEST_ENABLED:-false}
  TEST_TELEGRAM_CHAT_ID: ${TEST_TELEGRAM_CHAT_ID:-}
  TEST_MIRROR_CHAT_ID: ${TEST_MIRROR_CHAT_ID:-}
  PROGRESS_CARD_ENABLED: ${PROGRESS_CARD_ENABLED:-true}
  PROGRESS_CARD_AFTER_S: ${PROGRESS_CARD_AFTER_S:-4}
  PROGRESS_EDIT_MIN_INTERVAL_S: ${PROGRESS_EDIT_MIN_INTERVAL_S:-8}
  PROGRESS_MAX_SCREENSHOTS: ${PROGRESS_MAX_SCREENSHOTS:-4}
  TELEGRAM_GLOBAL_SEND_RATE: ${TELEGRAM_GLOBAL_SEND_RATE:-25}
  TASK_TIMEOUT_MAX_S: ${TASK_TIMEOUT_MAX_S:-1200}
  MACHINE_TASK_TIMEOUT_S: ${MACHINE_TASK_TIMEOUT_S:-900}
  MACHINE_FILE_MAX_MB: ${MACHINE_FILE_MAX_MB:-50}
  MACHINE_ENABLED: ${MACHINE_ENABLED:-false}
  MACHINE_BROWSER_ENABLED: ${MACHINE_BROWSER_ENABLED:-false}
  MACHINE_USERS: ${MACHINE_USERS:-[]}
  MACHINE_ALLOW_SPEND: ${MACHINE_ALLOW_SPEND:-false}
  MACHINE_LIVE_TOKEN_SECRET: ${MACHINE_LIVE_TOKEN_SECRET:-}
  SANDBOX_BACKEND: ${SANDBOX_BACKEND:-auto}
  BROWSER_BACKEND: ${BROWSER_BACKEND:-auto}
  AGENTCORE_REGION: ${AGENTCORE_REGION:-ap-south-1}
  AGENTCORE_CODE_INTERPRETER_ID: ${AGENTCORE_CODE_INTERPRETER_ID:-aws.codeinterpreter.v1}
  AGENTCORE_BROWSER_ID: ${AGENTCORE_BROWSER_ID:-aws.browser.v1}
  E2B_API_KEY: ${E2B_API_KEY:-}
  WORKSPACE_BACKEND: ${WORKSPACE_BACKEND:-auto}
  WORKSPACE_BUCKET: ${WORKSPACE_BUCKET:-}
  WORKSPACE_PREFIX: ${WORKSPACE_PREFIX:-ws/}
  MACHINE_MAX_CONCURRENT: ${MACHINE_MAX_CONCURRENT:-3}
  MACHINE_USER_DAILY_MINUTES: ${MACHINE_USER_DAILY_MINUTES:-60}
  MACHINE_USER_MONTHLY_USD: ${MACHINE_USER_MONTHLY_USD:-5}
  WORKSPACE_QUOTA_MB: ${WORKSPACE_QUOTA_MB:-500}
  OPERATOR_MAX_STEPS: ${OPERATOR_MAX_STEPS:-30}
  ANALYST_MAX_STEPS: ${ANALYST_MAX_STEPS:-20}
  MACHINE_PLATFORM_TAGS: ${MACHINE_PLATFORM_TAGS:-["manylinux2014_x86_64","manylinux_2_17_x86_64","linux_x86_64"]}
  MACHINE_PYTHON_VERSION: ${MACHINE_PYTHON_VERSION:-3.12}
  BROWSER_DOMAIN_DENY: ${BROWSER_DOMAIN_DENY:-[]}
  ATTENTION_UNDERSTAND_PER_WINDOW: ${ATTENTION_UNDERSTAND_PER_WINDOW:-4}
  ATTENTION_WINDOW_S: ${ATTENTION_WINDOW_S:-120}
  ATTENTION_MAX_ATTEMPTS: ${ATTENTION_MAX_ATTEMPTS:-2}
  ATTENTION_CURRENCY: ${ATTENTION_CURRENCY:-INR}
  ATTENTION_ASK_THRESHOLD: ${ATTENTION_ASK_THRESHOLD:-0.6}
  ATTENTION_NOTIFY_THRESHOLD: ${ATTENTION_NOTIFY_THRESHOLD:-0.7}
  ATTENTION_BRIEF_THRESHOLD: ${ATTENTION_BRIEF_THRESHOLD:-0.35}
  ATTENTION_PREF_SIMILARITY: ${ATTENTION_PREF_SIMILARITY:-0.8}
  ATTENTION_ALLOW_URGENT: ${ATTENTION_ALLOW_URGENT:-true}
  ATTENTION_RETENTION_DAYS: ${ATTENTION_RETENTION_DAYS:-90}
  ATTENTION_BACKFILL_MAX: ${ATTENTION_BACKFILL_MAX:-120}
  ATTENTION_DIGEST_HOURS: ${ATTENTION_DIGEST_HOURS:-24}
  ATTENTION_EVENING_ENABLED: ${ATTENTION_EVENING_ENABLED:-true}
  ATTENTION_EVENING_TIME: ${ATTENTION_EVENING_TIME:-20:30}
  GOOGLE_WORKSPACE_ENABLED: ${GOOGLE_WORKSPACE_ENABLED:-true}
  WORKSPACE_POLL_MINUTES: ${WORKSPACE_POLL_MINUTES:-30}

# The image is built once (on the box) by `migrate`; the other app services reuse the tag.
x-app: &app
  image: mavis:prod
  environment: *app-env
  volumes:
    - artifacts:/app/data/artifacts
    # the test sink (written by the worker) and the demo reports: shared so `--verify-machine` sees the
    # worker's sink and the reports survive a restart
    - e2edata:/app/data/e2e
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    qdrant: { condition: service_healthy }
    neo4j: { condition: service_healthy }

services:
  migrate:
    image: mavis:prod
    build: .
    environment: *app-env
    command: ["mavis", "migrate"]
    restart: "no"
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["mavis", "api"]
    mem_limit: 224m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/readyz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: ["mavis", "worker"]
    mem_limit: 900m            # ONNX embedding model (~400 MB resident) plus the machine runtime (sync, S3, boto3)
    healthcheck:
      # process liveness: PID 1 is tini, so look for the real `mavis worker` command line
      test: ["CMD", "python", "-c", "import os,sys;sys.exit(0 if any(b'mavis\\x00worker' in open(f'/proc/{p}/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit() and p!=str(os.getpid()) and os.path.exists(f'/proc/{p}/cmdline')) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  timer:
    <<: *app
    command: ["mavis", "timer"]
    mem_limit: 160m
    healthcheck:
      # process liveness: PID 1 is tini, so look for the real `mavis timer` command line
      test: ["CMD", "python", "-c", "import os,sys;sys.exit(0 if any(b'mavis\\x00timer' in open(f'/proc/{p}/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit() and p!=str(os.getpid()) and os.path.exists(f'/proc/{p}/cmdline')) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mavis
      POSTGRES_DB: mavis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "effective_cache_size=256MB",
              "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=60"]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 192m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mavis -d mavis"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    mem_limit: 96m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    environment:
      QDRANT__SERVICE__MAX_WORKERS: "1"
    volumes: [qdrantdata:/qdrant/storage]
    mem_limit: 192m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_PLUGINS: "[]"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_server_jvm_additional: "-XX:+ExitOnOutOfMemoryError"  # let the restart policy recover an OOM-ed JVM
    volumes: [neo4jdata:/data]
    mem_limit: 640m            # 256m heap + 128m pagecache + JVM/native overhead
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  caddy:
    image: caddy:2
    profiles: ["prod"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    mem_limit: 48m
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  neo4jdata:
  artifacts:
  e2edata:
  caddydata:
  caddyconfig:

# Production stack for ONE t4g.small (arm64, 2 GB RAM + 2 GB swap). See deploy/aws/README section in README.md.
#   docker compose -f docker-compose.prod.yml --profile prod up -d --build
# Variables come from the .env next to this file (deploy/.env.prod.example documents them).
# The `prod` profile adds Caddy (HTTPS). Without it the api is reachable only inside the compose network
# (or via an override that publishes a port, which is how it is smoke-tested locally).
name: mavis-prod

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app-env: &app-env
  ENV: ${ENV:-prod}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
  LOG_JSON: "true"
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
  COMPOSIO_WEBHOOK_SECRET: ${COMPOSIO_WEBHOOK_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_MODE: ${TELEGRAM_MODE:-webhook}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET}
  ALLOWED_TELEGRAM_CHAT_IDS: ${ALLOWED_TELEGRAM_CHAT_IDS:?set ALLOWED_TELEGRAM_CHAT_IDS}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  DATABASE_URL: postgresql+psycopg://mavis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mavis
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}

# The image is built once (on the box) by `migrate`; the other app services reuse the tag.
x-app: &app
  image: mavis:prod
  environment: *app-env
  volumes:
    - artifacts:/app/data/artifacts
  restart: unless-stopped
  logging: *logging
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    qdrant: { condition: service_healthy }
    neo4j: { condition: service_healthy }

services:
  migrate:
    image: mavis:prod
    build: .
    environment: *app-env
    command: ["mavis", "migrate"]
    restart: "no"
    logging: *logging
    mem_limit: 256m
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["mavis", "api"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/readyz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: ["mavis", "worker"]
    mem_limit: 512m            # loads the ONNX embedding model (~250 MB resident)
    healthcheck: { test: ["CMD-SHELL", "kill -0 1"], interval: 30s, timeout: 3s, retries: 3 }  # process liveness; tini exits with the app

  timer:
    <<: *app
    command: ["mavis", "timer"]
    mem_limit: 192m
    healthcheck: { test: ["CMD-SHELL", "kill -0 1"], interval: 30s, timeout: 3s, retries: 3 }  # process liveness; tini exits with the app

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mavis
      POSTGRES_DB: mavis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "effective_cache_size=256MB",
              "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=60"]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 224m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mavis -d mavis"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    environment:
      QDRANT__SERVICE__MAX_WORKERS: "1"
    volumes: [qdrantdata:/qdrant/storage]
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"   # loopback only: used by deploy/aws/migrate-data.sh
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_PLUGINS: "[]"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes: [neo4jdata:/data]
    mem_limit: 640m            # 256m heap + 128m pagecache + JVM/native overhead
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  caddy:
    image: caddy:2
    profiles: ["prod"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  neo4jdata:
  artifacts:
  caddydata:
  caddyconfig:

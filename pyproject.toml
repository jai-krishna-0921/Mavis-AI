[project]
name = "zento"
version = "0.1.0"
description = "Mavis AI: a 24/7 proactive personal assistant agent"
readme = "README.md"
authors = [
    { name = "jai krishna", email = "jaikrishna0921@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "boto3>=1.43.107",
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langfuse>=4.16.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "neo4j>=6.3.1",
    "psycopg[binary]>=3.3.6",
    "pyahocorasick>=2.3.1",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot[job-queue]>=21",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.2",
    "structlog>=26.1.0",
    "tavily-python>=0.8.4",
    "typer>=0.27.2",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[project.scripts]
zento = "zento.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: performance tests (deselect with -m 'not slow')"]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:telegram.*"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends/Header defaults
